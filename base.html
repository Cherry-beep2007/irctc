<form class="bg-white p-5 rounded-5 m-5">
  <div class="mb-3">
    <center class="m-3 p-3 text-xl-center"> <b>Plan your Trip</b></center>
    <label for="origin" class="mb-3 font-monospace text-danger">Origin Station:</label>
    <select class="form-select" aria-label="Default select example">
        <option selected>--select--</option>
        <option value="1">Secundrabad</option>
        <option value="2">Nampally</option>
        <option value="3">Kachiguda</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="destination" class="mb-3 font-monospace text-primary">destination: </label>
    <select class="form-select" aria-label="Default select example">
        <option selected>--select--</option>
        <option value="1">Vijayawada</option>
        <option value="2">Vizag</option>
        <option value="3">Tirupathi</option>
    </select>
  </div>
  <div class="mb-3 form-check">
    <label for="date" class="m-3 text-dark font-monospace ">Journey Date:</label>
    <input type="datetime-local" name="date" id="JDate" class="rounded-start-5 p-1">
  </div>
 
  <button type="submit" class="btn btn-primary shadow-lg">Submit</button>
</form>
